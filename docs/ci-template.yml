# Move this file to .github/workflows/ci.yml manually.
# (GitHub App used here lacks the `workflows` permission, so the workflow
# file cannot be written via API.)

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  mod:
    name: Mod / NeoForge (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Test
        run: ./gradlew test --no-daemon --stacktrace
      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warproject-mod
          path: build/libs/*.jar
          if-no-files-found: error
