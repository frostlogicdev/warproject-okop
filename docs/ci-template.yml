# Move this file to .github/workflows/ci.yml manually.
# (GitHub App used here lacks the `workflows` permission, so the workflow
# file cannot be written via API.)

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  mod:
    name: Mod / NeoForge (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: warproject-mod
          path: build/libs/*.jar
          if-no-files-found: warn

  launcher:
    name: Launcher / Electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - working-directory: launcher
        run: npm ci
      - working-directory: launcher
        run: npx vite build || echo "Vite build skipped"

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
